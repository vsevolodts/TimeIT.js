<!DOCTYPE html>
<html>

</head>
<body>
<input type="text" value="2014-05-16" />
<button>test</button>

<script src="timeit.js"></script>
<script>
var offset = new Date().getTimezoneOffset();
var button = document.querySelector('button');
var input = document.querySelector('input');

button.addEventListener('click', function () {
  var n = oTime(input.value);
  var node = document.createElement('div');
  node.innerHTML = '<br><b>timestamp:</b> ' + n + ' | date: ' + new Date(n) + ', Offset: ' + offset;
  this.parentNode.insertBefore(node, this.nextSibling);
});


function fretutn () {
  var n = new Date().getTime();
  return n;
}

  function oTime (t) {
    //var n = new Date().getTime();
		t = t || new Date(); /*fretutn(n)*/
		var oDate = new Date(t);
		if (!Date.parse(oDate)) {var oDate = new Date();}
		oDate.setHours(
			parseInt(t.substr(0, 2), 10),
			parseInt(t.substr(3, 2), 10),
			0,
			0
		);
	var callback = oDate.getTime();
	return callback;
 };
 
 </script>


</body>
